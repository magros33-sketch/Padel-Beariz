<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pádel Beariz</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7f5;
color:#17221b
}

header{
background:#123b2a;
color:#fff;
padding:18px
}

.wrap{
max-width:980px;
margin:auto;
padding:16px
}

h1{margin:0 0 4px}

.sub{opacity:.85}

.tabs{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-bottom:12px
}

button{
border:0;
border-radius:10px;
padding:11px 14px;
background:#1e7a55;
color:#fff;
font-weight:700
}

button.active{background:#f2a900}

.danger{background:#b3261e}

.card{
background:#fff;
border-radius:16px;
padding:16px;
margin:12px 0;
box-shadow:0 2px 10px #0001
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
gap:10px
}

.slot{
padding:14px;
border-radius:12px;
background:#e7f4ed;
border:1px solid #b9ddca
}

.slot.busy{
background:#ffe5e5;
border-color:#f4b3b3
}

.small{
font-size:13px;
color:#68746d
}

.hidden{display:none}

.status{
padding:10px;
border-radius:10px;
background:#fff3cd
}

.ok{background:#dff4e7}

.money{
font-size:30px;
font-weight:800
}

input,select{
width:100%;
padding:11px;
border:1px solid #ccd5cf;
border-radius:9px;
margin:5px 0 10px
}

label{font-weight:700}

.row{
display:flex;
gap:10px;
align-items:center;
justify-content:space-between;
flex-wrap:wrap
}

table{
width:100%;
border-collapse:collapse
}

th,td{
padding:9px;
border-bottom:1px solid #eee;
text-align:left
}

@media(max-width:600px){
.wrap{padding:10px}
.tabs button{flex:1 1 45%}
table{font-size:13px}
}
</style>
</head>

<body>

<header>
<div class="wrap">
<h1>🎾 Pádel Beariz</h1>
<div class="sub">Reservas · Ingresos</div>
</div>
</header>

<main class="wrap">

<div id="cloudStatus" class="status">
🟡 Conectando…
</div>

<div class="tabs">

<button class="active" onclick="show('reservas',this)">
📅 Reservas
</button>

<button onclick="show('nueva',this)">
➕ Nueva
</button>

<button class="adminOnly" onclick="show('ingresos',this)">
💰 Ingresos
</button>

<button class="adminOnly" onclick="show('config',this)">
⚙️ Configuración
</button>

<button onclick="adminLogin()">
🔐 Admin
</button>

<button class="adminOnly" onclick="logoutAdmin()">
Salir
</button>

</div>


<!-- RESERVAS -->

<section id="reservas" class="page">

<div class="card">

<div class="row">

<label>
Fecha
<input id="viewDate" type="date" onchange="renderSlots()">
</label>

<button onclick="setToday()">
Hoy
</button>

</div>

</div>


<div class="card">

<h2>Horarios</h2>

<div class="small">
Cada reserva dura
<span id="durText">90</span>
minutos · Precio €
<span id="priceText">12</span>
</div>

<div id="slots" class="grid"></div>

</div>

</section>


<!-- NUEVA RESERVA -->

<section id="nueva" class="page hidden">

<div class="card">

<h2>➕ Nueva reserva</h2>

<label>
Fecha
<input id="date" type="date">
</label>

<label>
Hora de inicio
<select id="time"></select>
</label>

<label>
Nombre
<input id="player" placeholder="Nombre del jugador">
</label>

<label>
Teléfono
<input id="phone" inputmode="tel" placeholder="Teléfono">
</label>

<label>
Pago

<select id="pay">

<option>Pendiente</option>
<option>Efectivo</option>
<option>Tarjeta</option>

</select>

</label>

<button onclick="createReservation()">
Reservar
</button>

</div>

</section>


<!-- INGRESOS -->

<section id="ingresos" class="page hidden adminOnly">

<div class="card">

<label>
Mes
<input id="monthPick" type="month" onchange="renderIncome">
</label>

<div class="money" id="total">
€0.00
</div>

<div class="small" id="count">
0 reservas cobradas
</div>

</div>


<div class="card">

<div style="overflow:auto">

<table>

<thead>

<tr>
<th>Fecha</th>
<th>Horario</th>
<th>Jugador</th>
<th>Pago</th>
<th>Importe</th>
</tr>

</thead>

<tbody id="incomeRows"></tbody>

</table>

</div>

</div>

</section>


<!-- CONFIGURACIÓN -->

<section id="config" class="page hidden adminOnly">

<div class="card">

<h2>⚙️ Configuración</h2>

<label>
Precio (€)
<input id="price" type="number" step="0.50">
</label>

<label>
Duración (minutos)
<input id="duration" type="number" step="30">
</label>

<label>
Inicio
<input id="start" type="time">
</label>

<label>
Fin
<input id="end" type="time">
</label>

<button onclick="saveConfig()">
Guardar configuración
</button>

</div>

</section>

</main>


<script>

const SUPABASE_URL =
'https://jppsqrbpjwulzapyvpim.supabase.co';

const SUPABASE_KEY =
'sb_publishable_M_k6UDXHwXZ7lvMSYQWp2w_iOEUIa23';

const API =
SUPABASE_URL + '/rest/v1/reservas';


let data = {

reservas:[],

price:12,

duration:90,

start:'09:00',

end:'00:00'

};


const today =
new Date().toISOString().slice(0,10);


viewDate.value = today;

date.value = today;

monthPick.value = today.slice(0,7);



function isAdmin(){

return sessionStorage.getItem('padelAdmin') === '1';

}



function adminLogin(){

let p =
prompt('PIN de administrador:');

if(p === null)return;

let saved =
localStorage.getItem('padelPin') || '1234';


if(p === saved){

sessionStorage.setItem(
'padelAdmin',
'1'
);

applyRole();

alert('Administrador activado');

}else{

alert('PIN incorrecto');

}

}



function logoutAdmin(){

sessionStorage.removeItem(
'padelAdmin'
);

applyRole();

show('reservas');

}



function applyRole(){

document
.querySelectorAll('.adminOnly')
.forEach(e => {

e.style.display =
isAdmin() ? '' : 'none';

});

}



function show(id,b){

document
.querySelectorAll('.page')
.forEach(x =>
x.classList.add('hidden')
);

document
.getElementById(id)
.classList.remove('hidden');


if(b){

document
.querySelectorAll('.tabs button')
.forEach(x =>
x.classList.remove('active')
);

b.classList.add('active');

}

render();

}



function setToday(){

viewDate.value = today;

renderSlots();

}



/* HORARIOS */

function times(){

let out=[];

let parts =
data.start.split(':').map(Number);

let h = parts[0];

let m = parts[1];


let endParts =
data.end.split(':').map(Number);

let eh = endParts[0];

let em = endParts[1];


let end =
eh * 60 + em;

if(end === 0)
end = 1440;


let cur =
h * 60 + m;


while(
cur + Number(data.duration) <= end
){

let inicio =
String(Math.floor(cur/60))
.padStart(2,'0')
+ ':' +
String(cur%60)
.padStart(2,'0');


out.push(inicio);

cur += Number(data.duration);

}

return out;

}



/* HORA FINAL */

function horaFin(inicio){

let p =
inicio.split(':').map(Number);

let minutos =
p[0]*60 + p[1];

minutos += Number(data.duration);


let h =
Math.floor(minutos/60);

let m =
minutos % 60;


if(h >= 24)
h -= 24;


return String(h).padStart(2,'0')
+ ':' +
String(m).padStart(2,'0');

}



/* ESCAPAR TEXTO */

function esc(v){

return String(v ?? '')
.replace(
/[&<>"']/g,
m => ({

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'

}[m])

);

}



/* MOSTRAR HORARIOS */

function renderSlots(){

let d =
viewDate.value;


slots.innerHTML =
times().map(t => {

let fin =
horaFin(t);


let r =
data.reservas.find(x =>

String(x.fecha || '') === d &&

String(x.hora_inicio || '')
.slice(0,5) === t &&

String(x.estado || '') !== 'Cancelada'

);


return r ?

`<div class="slot busy">

<b>${t} - ${fin}</b>

<br>

🔴 Ocupado

<br>

<span class="small">
${esc(r.nombre || '')}
</span>

${isAdmin() ?

`<br>
<button
class="danger"
onclick="cancelar('${esc(r.id)}')">
Cancelar
</button>`

: ''}

</div>`

:

`<div class="slot">

<b>${t} - ${fin}</b>

<br>

🟢 Disponible

<br>

<button
onclick="reserveAt('${d}','${t}')">
Reservar
</button>

</div>`;

}).join('');


durText.textContent =
data.duration;

priceText.textContent =
Number(data.price).toFixed(2);

}



/* RESERVAR DESDE HORARIO */

function reserveAt(d,t){

date.value = d;

render();

time.value = t;

show('nueva');

}



/* CARGAR SUPABASE */

async function cargarNube(){

try{

let r =
await fetch(
API +
'?select=*&order=fecha.asc,hora_inicio.asc',
{

headers:{

apikey:SUPABASE_KEY,

Authorization:
'Bearer ' + SUPABASE_KEY

}

}
);


if(!r.ok)
throw Error(await r.text());


data.reservas =
await r.json();


localStorage.setItem(
'padelReservas',
JSON.stringify(
data.reservas
)
);


cloudStatus.textContent =
'🟢 Conectado a Supabase';

cloudStatus.className =
'status ok';


}catch(e){

data.reservas =
JSON.parse(
localStorage.getItem(
'padelReservas'
) || '[]'
);


cloudStatus.textContent =
'🔴 Error de Supabase';

cloudStatus.className =
'status';

console.log(e);

}


render();

}



/* CREAR RESERVA */

async function createReservation(){

let d =
date.value;

let t =
time.value;

let n =
player.value.trim();


if(!d || !t || !n){

alert(
'Completa fecha, hora y nombre'
);

return;

}


let fin =
horaFin(t);


/* COMPROBAR HORARIO */

if(
data.reservas.some(r =>

String(r.fecha) === d &&

String(r.hora_inicio || '')
.slice(0,5) === t &&

String(r.estado || '') !== 'Cancelada'

)
){

alert(
'Ese horario ya está ocupado'
);

return;

}


/* DATOS PARA SUPABASE */

let r = {

fecha:d,

hora_inicio:t,

hora_fin:fin,

nombre:n,

telefono:phone.value.trim(),

pago:pay.value,

estado:'Pendiente'

};


console.log('Reserva enviada:',r);


try{

let resp =
await fetch(
API,
{

method:'POST',

headers:{

apikey:SUPABASE_KEY,

Authorization:
'Bearer ' + SUPABASE_KEY,

'Content-Type':
'application/json',

Prefer:
'return=representation'

},

body:
JSON.stringify(r)

}
);


if(!resp.ok){

let errorText =
await resp.text();

throw Error(errorText);

}


alert(
'✅ Reserva registrada'
);


player.value='';

phone.value='';


await cargarNube();

show('reservas');


}catch(e){

console.error(e);

alert(
'No se pudo guardar la reserva.\n\n'
+ e.message
);

}

}



/* CANCELAR */

async function cancelar(id){

if(!isAdmin()){

alert(
'Solo el administrador'
);

return;

}


if(
!confirm(
'¿Cancelar esta reserva?'
)
)
return;


try{

let r =
await fetch(

API +
'?id=eq.' +
encodeURIComponent(id),

{

method:'PATCH',

headers:{

apikey:SUPABASE_KEY,

Authorization:
'Bearer ' + SUPABASE_KEY,

'Content-Type':
'application/json'

},

body:
JSON.stringify({

estado:'Cancelada'

})

}

);


if(!r.ok)
throw Error(await r.text());


await cargarNube();


}catch(e){

alert(
'No se pudo cancelar.\n' +
e.message
);

}

}



/* INGRESOS */

function renderIncome(){

if(!isAdmin())
return;


let m =
monthPick.value;


let rs =
data.reservas.filter(r =>

String(r.fecha || '')
.startsWith(m) &&

r.pago &&

r.pago !== 'Pendiente' &&

String(r.estado || '') !== 'Cancelada'

);


let total =
rs.length *
Number(data.price);


document.getElementById(
'total'
).textContent =
'€' + total.toFixed(2);


document.getElementById(
'count'
).textContent =
rs.length +
' reservas cobradas';


incomeRows.innerHTML =
rs.map(r =>

`<tr>

<td>${esc(r.fecha)}</td>

<td>
${esc(
String(r.hora_inicio || '')
.slice(0,5)
)}
-
${esc(
String(r.hora_fin || '')
.slice(0,5)
)}
</td>

<td>${esc(r.nombre)}</td>

<td>${esc(r.pago)}</td>

<td>
€${Number(data.price).toFixed(2)}
</td>

</tr>`

).join('');

}



/* CONFIGURACIÓN */

function saveConfig(){

if(!isAdmin()){

alert(
'Solo el administrador'
);

return;

}


data.price =
Number(price.value) || 12;

data.duration =
Number(duration.value) || 90;

data.start =
start.value || '09:00';

data.end =
end.value || '00:00';


localStorage.setItem(
'padelConfig',
JSON.stringify(data)
);


render();


alert(
'Configuración guardada en este móvil'
);

}



/* RENDER */

function render(){

price.value =
data.price;

duration.value =
data.duration;

start.value =
data.start;

end.value =
data.end;


time.innerHTML =
times().map(t =>

`<option value="${t}">
${t} - ${horaFin(t)}
</option>`

).join('');


renderSlots();

renderIncome();

applyRole();

}



/* CONFIGURACIÓN LOCAL */

let cfg =
JSON.parse(
localStorage.getItem(
'padelConfig'
) || 'null'
);


if(cfg){

data.price =
cfg.price || 12;

data.duration =
cfg.duration || 90;

data.start =
cfg.start || '09:00';

data.end =
cfg.end || '00:00';

}



/* INICIAR */

render();

cargarNube();

setInterval(
cargarNube,
15000
);

</script>

</body>
</html>
