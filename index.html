<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pádel Beariz</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f4f7;color:#222}
header{background:#111827;color:#fff;padding:18px;text-align:center}
h1{margin:0 0 5px}
main{max-width:700px;margin:auto;padding:15px}
button,input,select{width:100%;padding:13px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px}
button{background:#111827;color:#fff;border:0;font-weight:bold}
button.secondary{background:#4b5563}
button.danger{background:#dc2626}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
.slot{padding:14px;margin:8px 0;border-radius:10px;background:#dcfce7;border:1px solid #86efac;cursor:pointer}
.slot.busy{background:#fee2e2;border-color:#fca5a5;cursor:default}
.admininfo{margin-top:8px;padding:10px;background:#fff;border-radius:8px}
.weekday{font-size:19px;font-weight:bold;margin-top:20px}
.small{font-size:13px;color:#666}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h1>🎾 Pádel Beariz</h1>
<div>Reserva tu pista</div>
</header>

<main>

<div id="menu" class="card">
<button onclick="mostrar('semana')">📅 Reservar pista</button>
<button onclick="mostrar('reservas')">📋 Reservas</button>
<button onclick="mostrar('admin')">⚙️ Administración</button>
</div>

<div id="semana" class="card hidden">
<h2>Reservas de la semana</h2>
<div id="week"></div>
<button class="secondary" onclick="mostrar('menu')">Volver</button>
</div>

<div id="nueva" class="card hidden">
<h2>Reservar pista</h2>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Hora</label>
<select id="hora"></select>

<label>Nombre</label>
<input id="nombre" placeholder="Tu nombre">

<label>Teléfono</label>
<input id="telefono" placeholder="Teléfono">

<label>Método de pago</label>
<select id="pago">
<option value="Pendiente">Pendiente</option>
<option value="Efectivo">Efectivo</option>
<option value="Tarjeta">Tarjeta</option>
</select>

<button onclick="crearReserva()">Confirmar reserva</button>
<button class="secondary" onclick="mostrar('semana')">Cancelar</button>
</div>

<div id="reservas" class="card hidden">
<h2>📋 Reservas</h2>
<div id="listaReservas"></div>
<button class="secondary" onclick="mostrar('menu')">Volver</button>
</div>

<div id="admin" class="card hidden">
<h2>⚙️ Administración</h2>

<div id="loginAdmin">
<input id="pinAdmin" type="password" placeholder="Contraseña de administrador">
<button onclick="entrarAdmin()">Entrar</button>
</div>

<div id="panelAdmin" class="hidden">

<h3>Configuración</h3>

<label>Precio (€)</label>
<input id="precioConfig" type="number" value="12">

<label>Duración (minutos)</label>
<input id="duracionConfig" type="number" value="90">

<button onclick="guardarConfig()">Guardar configuración</button>

<h3>Ingresos del mes</h3>
<div id="ingresos">0 €</div>

<button class="danger" onclick="salirAdmin()">Cerrar administración</button>

</div>

<button class="secondary" onclick="mostrar('menu')">Volver</button>
</div>

</main>

<script>

const SUPABASE_URL="https://jppsqrbpjwulzapyvpim.supabase.co";
const SUPABASE_KEY="sb_publishable_M_k6UDXHwXZ7lvMSYQWp2w_iOEUIa23";
const API=SUPABASE_URL+"/rest/v1/reservas";

let reservas=[];
let admin=false;

let config={
 precio:12,
 duracion:90,
 inicio:"09:00",
 fin:"00:00"
};

function normalizarHora(v){
 return String(v||"").slice(0,5);
}

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function isAdmin(){
 return admin===true;
}

function mostrar(id){

 document.querySelectorAll("main>div").forEach(x=>{
  x.classList.add("hidden");
 });

 document.getElementById(id).classList.remove("hidden");

 if(id==="semana"){
  cargarHoras();
  renderWeek();
 }

 if(id==="reservas"){
  renderReservas();
 }

 if(id==="admin"){
  actualizarAdmin();
 }
}

function actualizarAdmin(){

 if(isAdmin()){
  document.getElementById("loginAdmin").classList.add("hidden");
  document.getElementById("panelAdmin").classList.remove("hidden");
  document.getElementById("precioConfig").value=config.precio;
  document.getElementById("duracionConfig").value=config.duracion;
  calcularIngresos();
 }else{
  document.getElementById("loginAdmin").classList.remove("hidden");
  document.getElementById("panelAdmin").classList.add("hidden");
 }
}

function entrarAdmin(){

 const pin=document.getElementById("pinAdmin").value;
 const guardado=localStorage.getItem("padel_admin_pin")||"1234";

 if(pin===guardado){
  admin=true;
  document.getElementById("pinAdmin").value="";
  actualizarAdmin();
  renderWeek();
 }else{
  alert("Contraseña incorrecta");
 }
}

function salirAdmin(){
 admin=false;
 actualizarAdmin();
 renderWeek();
}

function guardarConfig(){

 config.precio=Number(document.getElementById("precioConfig").value)||12;
 config.duracion=Number(document.getElementById("duracionConfig").value)||90;

 localStorage.setItem("padel_config",JSON.stringify(config));

 cargarHoras();
 renderWeek();

 alert("Configuración guardada");
}

function cargarConfig(){

 try{
  const x=JSON.parse(localStorage.getItem("padel_config"));
  if(x)config={...config,...x};
 }catch(e){}
}

function generarHoras(){

 let salida=[];
 let minutos=9*60;

 while(minutos<24*60){

  let h=Math.floor(minutos/60);
  let m=minutos%60;

  salida.push(
   String(h).padStart(2,"0")+":"+
   String(m).padStart(2,"0")
  );

  minutos+=config.duracion;
 }

 return salida;
}

function cargarHoras(){

 const select=document.getElementById("hora");
 if(!select)return;

 const actual=select.value;

 select.innerHTML="";

 generarHoras().forEach(h=>{
  const op=document.createElement("option");
  op.value=h;
  op.textContent=h;
  select.appendChild(op);
 });

 if(actual)select.value=actual;
}

function horaFin(hora){

 let [h,m]=hora.split(":").map(Number);
 let total=h*60+m+config.duracion;

 if(total>=1440)total-=1440;

 return String(Math.floor(total/60)).padStart(2,"0")+":"+
        String(total%60).padStart(2,"0");
}

function fechaTexto(fecha){

 const d=new Date(fecha+"T12:00:00");

 return d.toLocaleDateString("es-ES",{
  weekday:"long",
  day:"2-digit",
  month:"2-digit",
  year:"numeric"
 });
}

function fechaISO(d){
 return d.toISOString().slice(0,10);
}

function inicioSemana(){

 const hoy=new Date();
 hoy.setHours(12,0,0,0);

 const dia=hoy.getDay();
 const diferencia=dia===0?-6:1-dia;

 hoy.setDate(hoy.getDate()+diferencia);

 return hoy;
}

function reservaEnHorario(fecha,hora){

 return reservas.find(r=>{

  if(String(r.estado||"").toLowerCase()==="cancelada"){
   return false;
  }

  return String(r.fecha).slice(0,10)===fecha &&
   normalizarHora(r.hora_inicio)===hora &&
   String(r.pista||"Pista 1")==="Pista 1";
 });
}

function renderWeek(){

 const cont=document.getElementById("week");
 if(!cont)return;

 let html="";
 const lunes=inicioSemana();

 for(let i=0;i<7;i++){

  const d=new Date(lunes);
  d.setDate(lunes.getDate()+i);

  const fecha=fechaISO(d);

  html+=`<div class="weekday">${fechaTexto(fecha)}</div>`;

  generarHoras().forEach(t=>{

   const r=reservaEnHorario(fecha,t);

   if(r){

    let info="";

    if(isAdmin()){

     info=`
     <div class="admininfo">
     👤 <b>${esc(r.nombre||"Sin nombre")}</b>
     ${r.telefono?`<br>📞 ${esc(r.telefono)}`:""}
     ${r.metodo_pago?`<br>💳 ${esc(r.metodo_pago)}`:""}
     <br>
     <button
      class="danger"
      onclick="cancelarReserva('${fecha}','${t}')">
      Cancelar
     </button>
     </div>`;
    }

    html+=`
    <div class="slot busy">
    <b>${t}</b><br>
    🔴 Ocupado
    ${info}
    </div>`;

   }else{

    html+=`
    <div class="slot"
     onclick="reservarHora('${fecha}','${t}')">
    <b>${t}</b><br>
    🟢 Disponible<br>
    <span class="small">
    Pista 1 · ${config.precio} €
    </span>
    </div>`;
   }
  });
 }

 cont.innerHTML=html;
}

function reservarHora(fecha,hora){

 document.querySelectorAll("main>div")
 .forEach(x=>x.classList.add("hidden"));

 document.getElementById("nueva").classList.remove("hidden");

 document.getElementById("fecha").value=fecha;

 cargarHoras();

 document.getElementById("hora").value=hora;
}

async function crearReserva(){

 const d=document.getElementById("fecha").value;
 const t=document.getElementById("hora").value;
 const n=document.getElementById("nombre").value.trim();
 const phone=document.getElementById("telefono").value.trim();
 const pay=document.getElementById("pago").value;

 if(!d){
  alert("Selecciona una fecha");
  return;
 }

 if(!t){
  alert("Selecciona una hora");
  return;
 }

 if(!n){
  alert("Escribe tu nombre");
  return;
 }

 if(reservaEnHorario(d,t)){
  alert("Ese horario ya está ocupado");
  await cargarNube();
  mostrar("semana");
  return;
 }

 const r={
  pista:"Pista 1",
  usuario:n,
  fecha:d,
  hora_inicio:t,
  hora_fin:horaFin(t),
  precio:config.precio,
  metodo_pago:pay,
  estado:"Pendiente",
  nombre:n,
  telefono:phone
 };

 try{

  const respuesta=await fetch(API,{
   method:"POST",
   headers:{
    apikey:SUPABASE_KEY,
    Authorization:"Bearer "+SUPABASE_KEY,
    "Content-Type":"application/json",
    Prefer:"return=representation"
   },
   body:JSON.stringify(r)
  });

  if(!respuesta.ok){
   throw Error(await respuesta.text());
  }

  const resultado=await respuesta.json();

  if(Array.isArray(resultado)&&resultado.length){
   reservas.push(resultado[0]);
  }else{
   reservas.push(r);
  }

  localStorage.setItem(
   "padel_reservas",
   JSON.stringify(reservas)
  );

  alert("Reserva registrada correctamente");

  document.getElementById("nombre").value="";
  document.getElementById("telefono").value="";

  await cargarNube();
  mostrar("semana");

 }catch(e){

  alert(
   "No se pudo registrar la reserva.\n\n"+
   e.message
  );
 }
}

async function cargarNube(){

 try{

  const respuesta=await fetch(
   API+"?select=*&order=fecha.asc,hora_inicio.asc",
   {
    headers:{
     apikey:SUPABASE_KEY,
     Authorization:"Bearer "+SUPABASE_KEY
    }
   }
  );

  if(!respuesta.ok){
   throw Error(await respuesta.text());
  }

  const datos=await respuesta.json();

  if(Array.isArray(datos)){
   reservas=datos;

   localStorage.setItem(
    "padel_reservas",
    JSON.stringify(reservas)
   );
  }

  renderWeek();
  renderReservas();

 }catch(e){

  console.log("Error Supabase:",e);

  try{
   reservas=JSON.parse(
    localStorage.getItem("padel_reservas")||"[]"
   );
  }catch(x){
   reservas=[];
  }

  renderWeek();
  renderReservas();
 }
}


/* ==============================
   CANCELAR RESERVA
   SIN UTILIZAR EL ID
   ============================== */

async function cancelarReserva(fecha,hora){

 if(!isAdmin()){
  alert("Solo el administrador puede cancelar reservas.");
  return;
 }

 const reserva=reservaEnHorario(fecha,hora);

 if(!reserva){
  alert("No se encontró esa reserva.");
  await cargarNube();
  return;
 }

 const nombre=reserva.nombre||"Sin nombre";

 if(!confirm(
  "¿Cancelar la reserva de "+
  nombre+
  " el "+
  fecha+
  " a las "+
  hora+
  "?"
 )){
  return;
 }

 try{

  /*
   Buscamos directamente la fila
   por FECHA + HORA + PISTA.
  */

  const buscarUrl=
   API+
   "?fecha=eq."+encodeURIComponent(fecha)+
   "&pista=eq.Pista%201";

  const buscar=await fetch(
   buscarUrl,
   {
    headers:{
     apikey:SUPABASE_KEY,
     Authorization:"Bearer "+SUPABASE_KEY
    }
   }
  );

  if(!buscar.ok){
   throw Error(await buscar.text());
  }

  const filas=await buscar.json();

  const encontrada=filas.find(r=>
   normalizarHora(r.hora_inicio)===hora &&
   String(r.estado||"").toLowerCase()!=="cancelada"
  );

  if(!encontrada){
   throw Error(
    "Supabase no encontró esa reserva."
   );
  }

  /*
   Ahora actualizamos usando TODOS
   los datos de la reserva.
  */

  const actualizarUrl=
   API+
   "?fecha=eq."+encodeURIComponent(fecha)+
   "&pista=eq.Pista%201"+
   "&hora_inicio=eq."+encodeURIComponent(
    normalizarHora(encontrada.hora_inicio)
   );

  const respuesta=await fetch(
   actualizarUrl,
   {
    method:"PATCH",
    headers:{
     apikey:SUPABASE_KEY,
     Authorization:"Bearer "+SUPABASE_KEY,
     "Content-Type":"application/json",
     Prefer:"return=representation"
    },
    body:JSON.stringify({
     estado:"Cancelada"
    })
   }
  );

  if(!respuesta.ok){
   throw Error(await respuesta.text());
  }

  const resultado=await respuesta.json();

  if(!Array.isArray(resultado)||resultado.length===0){
   throw Error(
    "Supabase no actualizó la reserva."
   );
  }

  alert("Reserva cancelada correctamente.");

  await cargarNube();

  mostrar("semana");

 }catch(e){

  alert(
   "No se pudo cancelar la reserva.\n\n"+
   e.message
  );
 }
}

function renderReservas(){

 const cont=document.getElementById("listaReservas");
 if(!cont)return;

 const activas=reservas.filter(r=>
  String(r.estado||"").toLowerCase()!=="cancelada"
 );

 if(activas.length===0){
  cont.innerHTML="<p>No hay reservas registradas.</p>";
  return;
 }

 let html="";

 activas.forEach(r=>{

  html+=`
  <div class="card">
  <b>🎾 Pista 1</b><br>
  📅 ${esc(String(r.fecha).slice(0,10))}<br>
  🕐 ${esc(normalizarHora(r.hora_inicio))}
  -
  ${esc(normalizarHora(r.hora_fin))}<br>
  `;

  if(isAdmin()){

   html+=`
   👤 ${esc(r.nombre||"Sin nombre")}<br>
   ${r.telefono?"📞 "+esc(r.telefono)+"<br>":""}
   💳 ${esc(r.metodo_pago||"Pendiente")}<br>
   💶 ${esc(r.precio||config.precio)} €<br>

   <button
    class="danger"
    onclick="cancelarReserva(
     '${esc(String(r.fecha).slice(0,10))}',
     '${esc(normalizarHora(r.hora_inicio))}'
    )">
    Cancelar
   </button>`;
  }else{
   html+="🔴 Ocupado";
  }

  html+="</div>";
 });

 cont.innerHTML=html;
}

function calcularIngresos(){

 const ahora=new Date();

 const mes=ahora.getMonth();
 const año=ahora.getFullYear();

 let total=0;

 reservas.forEach(r=>{

  if(String(r.estado||"").toLowerCase()==="cancelada"){
   return;
  }

  const f=new Date(
   String(r.fecha).slice(0,10)+"T12:00:00"
  );

  if(
   f.getMonth()===mes &&
   f.getFullYear()===año
  ){
   total+=Number(r.precio||0);
  }
 });

 document.getElementById("ingresos").textContent=
  total.toFixed(2)+" €";
}

function cargarLocal(){

 try{

  const x=JSON.parse(
   localStorage.getItem("padel_reservas")||"[]"
  );

  if(Array.isArray(x)){
   reservas=x;
  }

 }catch(e){
  reservas=[];
 }
}

cargarConfig();
cargarLocal();
cargarHoras();
cargarNube();

setInterval(cargarNube,15000);

</script>

</body>
</html>
