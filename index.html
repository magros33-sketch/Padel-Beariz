<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pádel Beariz</title>

<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#222;
}
header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
  font-size:25px;
  font-weight:bold;
}
.container{
  max-width:650px;
  margin:auto;
  padding:18px;
}
.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}
h2{margin-top:0}
label{
  display:block;
  font-weight:bold;
  margin-top:12px;
}
input,select,button{
  width:100%;
  padding:13px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  background:#111;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:.9}
button.danger{background:#b00020}
button.secondary{background:#666}
.slot{
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:7px 0;
  cursor:pointer;
  background:#fff;
}
.slot.ocupado{
  background:#eee;
  color:#999;
  cursor:not-allowed;
}
.slot.seleccionado{
  background:#111;
  color:#fff;
}
.reserva{
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px;
  margin:10px 0;
}
.ok{
  background:#e7f7e7;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}
.error{
  background:#ffe7e7;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}
.small{
  color:#666;
  font-size:14px;
}
.hidden{display:none}
.admin-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
</style>
</head>

<body>

<header>🎾 Pádel Beariz</header>

<div class="container">

<div class="card">
<h2>Reservar pista</h2>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Nombre</label>
<input type="text" id="nombre" placeholder="Tu nombre">

<label>Teléfono</label>
<input type="tel" id="telefono" placeholder="Teléfono">

<label>Hora</label>
<div id="horas"></div>

<label>Forma de pago</label>
<select id="pago">
<option value="Pendiente">Pendiente</option>
<option value="Efectivo">Efectivo</option>
<option value="Tarjeta">Tarjeta</option>
</select>

<button onclick="reservar()">Reservar pista</button>

<div id="mensaje"></div>
</div>

<div class="card">
<h2>📋 Reservas registradas</h2>
<div id="listaReservas">Cargando...</div>
</div>

<div class="card">
<h2>🔐 Administración</h2>

<div id="loginAdmin">
<label>PIN de administrador</label>
<input type="password" id="pin" placeholder="PIN">

<button onclick="entrarAdmin()">Entrar</button>
</div>

<div id="panelAdmin" class="hidden">

<div class="admin-title">
<h2>Administración</h2>
<button onclick="salirAdmin()" style="width:auto;padding:8px 14px">
Salir
</button>
</div>

<label>Precio de la pista (€)</label>
<input type="number" id="precioAdmin" value="12">

<button onclick="guardarPrecio()">Guardar precio</button>

<h3>💰 Ingresos</h3>
<div id="ingresos">0 €</div>

<h3>Reservas</h3>
<div id="reservasAdmin"></div>

</div>
</div>

</div>

<script>

const SUPABASE_URL =
'https://jppsqrbpjwulzapyvpim.supabase.co';

const SUPABASE_KEY =
'sb_publishable_M_k6UDXHwXZ7lvMSYQWp2w_iOEUIa23';

const API =
SUPABASE_URL + '/rest/v1/reservas';

const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json'
};

let data = {
  price: 12,
  reservas: []
};

let horaSeleccionada = null;

const horasDisponibles = [
'09:00',
'10:30',
'12:00',
'13:30',
'15:00',
'16:30',
'18:00',
'19:30',
'21:00',
'22:30'
];

document.addEventListener('DOMContentLoaded', async function(){

  const hoy = new Date();
  const yyyy = hoy.getFullYear();
  const mm = String(hoy.getMonth()+1).padStart(2,'0');
  const dd = String(hoy.getDate()).padStart(2,'0');

  document.getElementById('fecha').value =
    yyyy + '-' + mm + '-' + dd;

  document.getElementById('fecha')
    .addEventListener('change', cargarHoras);

  cargarDatosLocales();
  await cargarNube();
  cargarHoras();

});

function cargarDatosLocales(){

  try{
    const guardado =
      localStorage.getItem('padelBeariz');

    if(guardado){
      const obj = JSON.parse(guardado);

      if(obj.price)
        data.price = obj.price;

      if(Array.isArray(obj.reservas))
        data.reservas = obj.reservas;
    }
  }catch(e){}

  document.getElementById('precioAdmin').value =
    data.price;
}

function guardarLocal(){

  localStorage.setItem(
    'padelBeariz',
    JSON.stringify(data)
  );

}

async function cargarNube(){

  try{

    const respuesta = await fetch(
      API + '?select=*&order=fecha.asc,hora_inicio.asc',
      {
        method:'GET',
        headers:HEADERS
      }
    );

    if(!respuesta.ok){
      throw new Error(
        'Error Supabase: ' + respuesta.status
      );
    }

    const reservas = await respuesta.json();

    data.reservas = reservas.map(r => ({
      ...r,
      precio:
        r.precio !== null &&
        r.precio !== undefined
        ? Number(r.precio)
        : Number(data.price)
    }));

    guardarLocal();
    renderReservas();
    cargarHoras();

  }catch(error){

    console.error(error);

    renderReservas();

  }

}

function horaFin(hora){

  const partes = hora.split(':');

  let h = Number(partes[0]);
  let m = Number(partes[1]);

  m += 90;

  if(m >= 60){
    h += Math.floor(m/60);
    m = m % 60;
  }

  return String(h).padStart(2,'0') +
    ':' +
    String(m).padStart(2,'0');

}

function normalizarHora(hora){

  if(!hora) return '';

  return String(hora).slice(0,5);

}

function reservaExiste(fecha,hora){

  return data.reservas.some(r => {

    if(r.estado === 'Cancelada')
      return false;

    return (
      r.fecha === fecha &&
      normalizarHora(r.hora_inicio) === hora
    );

  });

}

function cargarHoras(){

  const fecha =
    document.getElementById('fecha').value;

  const cont =
    document.getElementById('horas');

  cont.innerHTML = '';

  horaSeleccionada = null;

  horasDisponibles.forEach(hora => {

    const div = document.createElement('div');

    div.className = 'slot';

    div.textContent =
      hora + ' - ' + horaFin(hora);

    if(reservaExiste(fecha,hora)){

      div.classList.add('ocupado');

      div.textContent += ' · OCUPADA';

    }else{

      div.onclick = function(){

        document
          .querySelectorAll('.slot')
          .forEach(x =>
            x.classList.remove('seleccionado')
          );

        div.classList.add('seleccionado');

        horaSeleccionada = hora;

      };

    }

    cont.appendChild(div);

  });

}

async function reservar(){

  const fecha =
    document.getElementById('fecha').value;

  const nombre =
    document.getElementById('nombre')
      .value.trim();

  const telefono =
    document.getElementById('telefono')
      .value.trim();

  const pago =
    document.getElementById('pago').value;

  const mensaje =
    document.getElementById('mensaje');

  mensaje.innerHTML = '';

  if(!fecha){
    mostrarError('Selecciona una fecha.');
    return;
  }

  if(!nombre){
    mostrarError('Escribe tu nombre.');
    return;
  }

  if(!telefono){
    mostrarError('Escribe tu teléfono.');
    return;
  }

  if(!horaSeleccionada){
    mostrarError('Selecciona una hora.');
    return;
  }

  if(reservaExiste(fecha,horaSeleccionada)){
    mostrarError('Esa hora ya está ocupada.');
    await cargarNube();
    return;
  }

  const reserva = {

    pista: 1,

    usuario: nombre,

    fecha: fecha,

    hora_inicio: horaSeleccionada,

    hora_fin: horaFin(horaSeleccionada),

    precio: Number(data.price),

    metodo_pago: pago,

    estado: 'Pendiente',

    nombre: nombre,

    telefono: telefono

  };

  try{

    const respuesta = await fetch(
      API,
      {
        method:'POST',
        headers:{
          ...HEADERS,
          'Prefer':'return=representation'
        },
        body:JSON.stringify(reserva)
      }
    );

    const texto = await respuesta.text();

    if(!respuesta.ok){

      console.error(texto);

      mostrarError(
        'No se pudo guardar la reserva. ' +
        'Error ' + respuesta.status
      );

      return;

    }

    let guardada;

    try{
      guardada = JSON.parse(texto);
    }catch(e){
      guardada = [];
    }

    if(Array.isArray(guardada) &&
       guardada.length > 0){

      data.reservas.push(guardada[0]);

    }else{

      data.reservas.push(reserva);

    }

    guardarLocal();

    document.getElementById('nombre').value = '';
    document.getElementById('telefono').value = '';
    document.getElementById('pago').value = 'Pendiente';

    horaSeleccionada = null;

    mostrarOk(
      '✅ Reserva realizada correctamente.'
    );

    renderReservas();
    cargarHoras();

    await cargarNube();

  }catch(error){

    console.error(error);

    mostrarError(
      'Error de conexión con Supabase.'
    );

  }

}

function mostrarOk(texto){

  document.getElementById('mensaje').innerHTML =
    '<div class="ok">' + texto + '</div>';

}

function mostrarError(texto){

  document.getElementById('mensaje').innerHTML =
    '<div class="error">' + texto + '</div>';

}

function renderReservas(){

  const fecha =
    document.getElementById('fecha').value;

  const lista =
    document.getElementById('listaReservas');

  const reservas = data.reservas
    .filter(r =>
      r.fecha === fecha &&
      r.estado !== 'Cancelada'
    )
    .sort((a,b) =>
      normalizarHora(a.hora_inicio)
      .localeCompare(
        normalizarHora(b.hora_inicio)
      )
    );

  if(reservas.length === 0){

    lista.innerHTML =
      '<p class="small">No hay reservas para este día.</p>';

    return;

  }

  lista.innerHTML = '';

  reservas.forEach(r => {

    const div =
      document.createElement('div');

    div.className = 'reserva';

    div.innerHTML = `
      <strong>🎾 Pista 1</strong><br>
      🕐 ${normalizarHora(r.hora_inicio)}
      - ${normalizarHora(r.hora_fin)}<br>
      👤 ${escapeHtml(r.nombre || r.usuario || '')}<br>
      💶 ${Number(r.precio ?? data.price).toFixed(2)} €<br>
      💳 ${escapeHtml(r.metodo_pago || 'Pendiente')}
    `;

    lista.appendChild(div);

  });

}

function escapeHtml(text){

  return String(text)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

function entrarAdmin(){

  const pin =
    document.getElementById('pin').value;

  if(pin === '1234'){

    document
      .getElementById('loginAdmin')
      .classList.add('hidden');

    document
      .getElementById('panelAdmin')
      .classList.remove('hidden');

    renderAdmin();

  }else{

    alert('PIN incorrecto');

  }

}

function salirAdmin(){

  document
    .getElementById('panelAdmin')
    .classList.add('hidden');

  document
    .getElementById('loginAdmin')
    .classList.remove('hidden');

  document.getElementById('pin').value = '';

}

function guardarPrecio(){

  const precio =
    Number(
      document.getElementById('precioAdmin').value
    );

  if(!precio || precio <= 0){

    alert('Introduce un precio válido.');

    return;

  }

  data.price = precio;

  guardarLocal();

  alert('Precio guardado: ' + precio + ' €');

  cargarHoras();
  renderAdmin();

}

function renderAdmin(){

  document.getElementById('precioAdmin').value =
    data.price;

  const cont =
    document.getElementById('reservasAdmin');

  const reservas =
    data.reservas.filter(
      r => r.estado !== 'Cancelada'
    );

  let ingresos = 0;

  reservas.forEach(r => {

    ingresos += Number(
      r.precio ?? data.price
    );

  });

  document.getElementById('ingresos').textContent =
    ingresos.toFixed(2) + ' €';

  if(reservas.length === 0){

    cont.innerHTML =
      '<p class="small">No hay reservas.</p>';

    return;

  }

  cont.innerHTML = '';

  reservas
    .slice()
    .sort((a,b) =>
      String(a.fecha + a.hora_inicio)
      .localeCompare(
        String(b.fecha + b.hora_inicio)
      )
    )
    .forEach(r => {

      const div =
        document.createElement('div');

      div.className = 'reserva';

      div.innerHTML = `
        <strong>${r.fecha}</strong><br>
        🎾 Pista 1<br>
        🕐 ${normalizarHora(r.hora_inicio)}
        - ${normalizarHora(r.hora_fin)}<br>
        👤 ${escapeHtml(r.nombre || r.usuario || '')}<br>
        📞 ${escapeHtml(r.telefono || '')}<br>
        💶 ${Number(r.precio ?? data.price).toFixed(2)} €<br>
        💳 ${escapeHtml(r.metodo_pago || 'Pendiente')}<br><br>
        <button class="danger"
          onclick="cancelarReserva('${r.id}')">
          Cancelar reserva
        </button>
      `;

      cont.appendChild(div);

    });

}

async function cancelarReserva(id){

  if(!confirm('¿Cancelar esta reserva?'))
    return;

  try{

    const respuesta = await fetch(
      API + '?id=eq.' + encodeURIComponent(id),
      {
        method:'PATCH',
        headers:{
          ...HEADERS,
          'Prefer':'return=representation'
        },
        body:JSON.stringify({
          estado:'Cancelada'
        })
      }
    );

    if(!respuesta.ok){

      alert(
        'No se pudo cancelar la reserva.'
      );

      return;

    }

    await cargarNube();

    renderAdmin();
    renderReservas();
    cargarHoras();

    alert('Reserva cancelada.');

  }catch(error){

    console.error(error);

    alert(
      'Error de conexión.'
    );

  }

}

</script>

</body>
</html>
