<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pádel Beariz</title>
<link rel="icon" type="image/png" href="Icono moderno de pádel Beariz.png">
<link rel="apple-touch-icon" href="Icono moderno de pádel Beariz.png">

<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#222}
header{background:#123b5d;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:25px}
nav{display:flex;gap:5px;padding:8px;background:white;overflow:auto}
nav button{border:0;padding:10px 12px;border-radius:8px;background:#e8edf1;white-space:nowrap}
main{max-width:700px;margin:auto;padding:12px}
.card{background:white;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
h2{margin-top:0}
input,select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 10px;border:1px solid #ccc;border-radius:8px}
button{cursor:pointer}
.primary{background:#123b5d;color:white;border:0;padding:12px 16px;border-radius:8px}
.slot{padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;background:#fff}
.slot.ocupado{background:#eee;color:#777}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px;border-bottom:1px solid #ddd;text-align:left}
.smallbtn{padding:6px;border:0;border-radius:6px;margin:2px}
</style>
</head>

<body>

<header>
<h1>🎾 Pádel Beariz</h1>
<p>Reserva tu pista</p>
</header>

<nav>
<button onclick="show('reservas')">🏠 Inicio</button>
<button onclick="show('reservas')">Reservas</button>
<button onclick="show('nueva')">Nueva</button>
<button onclick="show('ingresos')">Ingresos</button>
<button onclick="show('config')">Configuración</button>
<button onclick="show('admin')">Admin</button>
<button onclick="logout()">Salir</button>
</nav>

<main>

<section id="reservas" class="card">
<h2>Reservas</h2>
<div id="listaReservas">Cargando...</div>
</section>

<section id="nueva" class="card" style="display:none">
<h2>Nueva reserva</h2>

<button onclick="show('reservas')" style="margin-bottom:10px">🏠 Inicio</button>

<label>Fecha</label>
<input type="date" id="date" onchange="render()">

<label>Hora</label>
<select id="time"></select>

<label>Nombre</label>
<input id="nombre" placeholder="Nombre">

<label>Teléfono</label>
<input id="telefono" placeholder="Teléfono">

<label>Pago</label>
<select id="pago">
<option>Pendiente</option>
<option>Efectivo</option>
<option>Tarjeta</option>
</select>

<button class="primary" onclick="createReservation()">Reservar pista</button>
</section>

<section id="ingresos" class="card" style="display:none">
<h2>Ingresos</h2>
<label>Mes</label>
<input type="month" id="mesIngreso" onchange="renderIncome()">
<div id="tablaIngresos"></div>
</section>

<section id="config" class="card" style="display:none">
<h2>Configuración</h2>

<label>Precio de la pista (€)</label>
<input type="number" id="precioConfig" min="0">

<button class="primary" onclick="saveConfig()">Guardar configuración</button>
</section>

<section id="admin" class="card" style="display:none">
<h2>Administración</h2>
<p id="adminEstado">Administrador no conectado.</p>
<button class="primary" onclick="adminLogin()">Entrar como administrador</button>
</section>

</main>

<script>
const SUPABASE_URL='https://jppsqrbpjwulzapyvpim.supabase.co';
const SUPABASE_KEY='sb_publishable_M_k6UDXHwXZ7lvMSYQWp2w_iOEUIa23';
const API=SUPABASE_URL+'/rest/v1/reservas';

let data={
  reservas:[],
  price:Number(localStorage.getItem('padelPrice')||12)
};

function headers(extra={}){
  return Object.assign({
    apikey:SUPABASE_KEY,
    Authorization:'Bearer '+SUPABASE_KEY
  },extra);
}

function isAdmin(){
  return sessionStorage.getItem('padelAdmin')==='1';
}

function show(id){
  ['reservas','nueva','ingresos','config','admin'].forEach(x=>{
    const e=document.getElementById(x);
    if(e)e.style.display=x===id?'block':'none';
  });

  if(id==='reservas')cargarNube();
  if(id==='ingresos')renderIncome();
  if(id==='config'){
    document.getElementById('precioConfig').value=data.price;
  }
}

function adminLogin(){
  let pin=prompt('Contraseña de administrador:');
  if(pin===null)return;

  const guardada=localStorage.getItem('padelPin')||'1234';

  if(pin===guardada){
    sessionStorage.setItem('padelAdmin','1');
    document.getElementById('adminEstado').textContent='Administrador conectado.';
    alert('Acceso correcto.');
    show('reservas');
  }else{
    alert('Contraseña incorrecta.');
  }
}

function logout(){
  sessionStorage.removeItem('padelAdmin');
  alert('Sesión cerrada.');
  show('reservas');
}

const horas=[];
for(let h=9;h<=22;h++){
  const hh=String(h).padStart(2,'0');
  horas.push(hh+':00');
  horas.push(hh+':30');
}
horas.push('23:00');
horas.push('23:30');

function fechaHoy(){
  const d=new Date();
  return d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');
}

document.getElementById('date').value=fechaHoy();

function horaFin(hora){
  let [h,m]=hora.split(':').map(Number);
  let minutos=h*60+m+90;
  let fh=Math.floor(minutos/60);
  let fm=minutos%60;
  return String(fh).padStart(2,'0')+':'+String(fm).padStart(2,'0');
}

function ocupado(fecha,hora){
  return data.reservas.some(r=>{
    if(String(r.fecha)!==String(fecha))return false;
    if(String(r.estado||'')==='Cancelada')return false;
    if(String(r.estado||'')==='Regalada')return true;

    const ini=String(r.hora_inicio||'').slice(0,5);
    const fin=String(r.hora_fin||'').slice(0,5);

    const a=hora.split(':').map(Number);
    const b=ini.split(':').map(Number);
    const c=fin.split(':').map(Number);

    const x=a[0]*60+a[1];
    const y=b[0]*60+b[1];
    const z=c[0]*60+c[1];

    return x<z && x+90>y;
  });
}

function render(){
  const fecha=document.getElementById('date').value;
  const selector=document.getElementById('time');

  selector.innerHTML=horas.map(h=>{
    const o=ocupado(fecha,h);
    return '<option value="'+h+'" '+(o?'disabled':'')+'>'+
      h+(o?' — OCUPADA':'')+
      '</option>';
  }).join('');
}

function reserveAt(d,t){
  document.getElementById('date').value=d;
  render();
  document.getElementById('time').value=t;
  show('nueva');
}

async function cargarNube(){
  try{
    const r=await fetch(API+'?select=*&order=fecha.asc,hora_inicio.asc',{
      headers:headers()
    });

    if(!r.ok)throw Error(await r.text());

    data.reservas=await r.json();
    renderSlots();
    renderIncome();
    render();
  }catch(e){
    document.getElementById('listaReservas').innerHTML=
      '<p>No se pudieron cargar las reservas.</p>';
  }
}

function renderSlots(){
  const cont=document.getElementById('listaReservas');

  if(!data.reservas.length){
    cont.innerHTML='<p>No hay reservas registradas.</p>';
    return;
  }

  cont.innerHTML=data.reservas.map(r=>{
    const cancelada=String(r.estado||'')==='Cancelada';
    const regalada=String(r.estado||'')==='Regalada';

    return `
    <div class="slot ${cancelada?'ocupado':''}">
      <b>${r.fecha||''}</b>
      — ${String(r.hora_inicio||'').slice(0,5)}
      a ${String(r.hora_fin||'').slice(0,5)}
      <br>
      👤 ${r.nombre||r.usuario||''}
      ${r.telefono?'<br>📞 '+r.telefono:''}
      <br>
      Estado: <b>${r.estado||''}</b>
      ${regalada?'<br>🎁 Pista regalada':''}
      ${cancelada?'<br>❌ Cancelada':''}

      ${!cancelada?`
      <br>
      <button class="smallbtn"
        onclick="solicitarCancelacion('${r.id}','${String(r.telefono||'').replace(/'/g,"\\'")}')">
        Solicitar cancelación
      </button>`:''}

      ${isAdmin()&&!cancelada?`
      <button class="smallbtn"
        onclick="cancelar('${r.id}')">
        Cancelar
      </button>`:''}
    </div>`;
  }).join('');
}

async function createReservation(){
  const fecha=document.getElementById('date').value;
  const hora=document.getElementById('time').value;
  const nombre=document.getElementById('nombre').value.trim();
  const telefono=document.getElementById('telefono').value.trim();
  const pago=document.getElementById('pago').value;

  if(!fecha||!hora||!nombre||!telefono){
    alert('Completa todos los datos.');
    return;
  }

  if(ocupado(fecha,hora)){
    alert('Ese horario ya está ocupado.');
    await cargarNube();
    return;
  }

  const body={
    pista:1,
    usuario:nombre,
    fecha:fecha,
    hora_inicio:hora,
    hora_fin:horaFin(hora),
    precio:data.price,
    metodo_pago:pago,
    estado:'Pendiente',
    nombre:nombre,
    telefono:telefono
  };

  try{
    const r=await fetch(API,{
      method:'POST',
      headers:headers({
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      }),
      body:JSON.stringify(body)
    });

    if(!r.ok)throw Error(await r.text());

    document.getElementById('nombre').value='';
    document.getElementById('telefono').value='';
    document.getElementById('pago').value='Pendiente';

    alert('Reserva realizada correctamente.');

    await cargarNube();
    show('reservas');

  }catch(e){
    alert('No se pudo guardar la reserva.\n'+e.message);
  }
}

async function solicitarCancelacion(id,telefono){
  const tel=prompt('Para solicitar la cancelación, introduce el teléfono usado en la reserva:');

  if(tel===null)return;

  const limpio=x=>String(x||'').replace(/\D/g,'');

  if(limpio(tel)!==limpio(telefono)){
    alert('El teléfono no coincide con la reserva.');
    return;
  }

  if(!confirm('¿Solicitar al administrador la cancelación de esta pista?'))return;

  try{
    const r=await fetch(API+'?id=eq.'+encodeURIComponent(id),{
      method:'PATCH',
      headers:headers({
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      }),
      body:JSON.stringify({estado:'Solicitud de cancelación'})
    });

    if(!r.ok)throw Error(await r.text());

    alert('Solicitud enviada al administrador.');
    await cargarNube();

  }catch(e){
    alert('No se pudo solicitar la cancelación.\n'+e.message);
  }
}

async function cancelar(id){
  if(!isAdmin()){
    alert('Solo el administrador puede cancelar.');
    return;
  }

  if(!confirm('¿Cancelar esta reserva?'))return;

  try{
    const r=await fetch(API+'?id=eq.'+encodeURIComponent(id),{
      method:'PATCH',
      headers:headers({
        'Content-Type':'application/json',
        'Prefer':'return=representation'
      }),
      body:JSON.stringify({estado:'Cancelada'})
    });

    if(!r.ok)throw Error(await r.text());

    await cargarNube();
    alert('Reserva cancelada.');

  }catch(e){
    alert('No se pudo cancelar.\n'+e.message);
  }
}

function renderIncome(){
  const box=document.getElementById('tablaIngresos');
  if(!box)return;

  if(!isAdmin()){
    box.innerHTML='<p>Solo el administrador puede ver los ingresos.</p>';
    return;
  }

  const mes=document.getElementById('mesIngreso').value ||
    new Date().toISOString().slice(0,7);

  const rs=data.reservas.filter(r=>
    String(r.fecha||'').startsWith(mes) &&
    r.metodo_pago &&
    r.metodo_pago!=='Pendiente' &&
    r.metodo_pago!=='Regalada' &&
    String(r.estado||'')!=='Cancelada'
  );

  const total=rs.reduce((a,r)=>
    a+Number(r.precio ?? data.price),0);

  if(!rs.length){
    box.innerHTML='<p>Total del mes: <b>0 €</b></p><p>No hay ingresos registrados.</p>';
    return;
  }

  box.innerHTML=`
  <p><b>Total del mes: ${total.toFixed(2)} €</b></p>

  <div style="overflow:auto">
  <table>
  <thead>
  <tr>
    <th>Fecha</th>
    <th>Hora</th>
    <th>Nombre</th>
    <th>Importe</th>
    <th>Pago</th>
    <th>Acción</th>
  </tr>
  </thead>
  <tbody>
  ${rs.map(r=>`
    <tr>
      <td>${r.fecha||''}</td>
      <td>${String(r.hora_inicio||'').slice(0,5)}</td>
      <td>${r.nombre||r.usuario||''}</td>
      <td>${Number(r.precio ?? data.price).toFixed(2)} €</td>
      <td>${r.metodo_pago||''}</td>
      <td>
        <button class="smallbtn" onclick="editarIngreso('${r.id}')">Editar</button>
        <button class="smallbtn" onclick="regalarIngreso('${r.id}')">Regalar</button>
        <button class="smallbtn" onclick="borrarIngreso('${r.id}')">Borrar</button>
      </td>
    </tr>
  `).join('')}
  </tbody>
  </table>
  </div>`;
}

async function editarIngreso(id){
  if(!isAdmin())return alert('Solo el administrador');

  let r=data.reservas.find(x=>String(x.id)===String(id));
  if(!r)return alert('Reserva no encontrada');

  let precio=prompt(
    'Importe de esta reserva (€):',
    String(r.precio ?? data.price)
  );

  if(precio===null)return;

  precio=Number(precio);

  if(!Number.isFinite(precio)||precio<0){
    alert('Importe no válido');
    return;
  }

  let pago=prompt(
    'Forma de pago (Efectivo, Tarjeta o Pendiente):',
    r.metodo_pago||'Pendiente'
  );

  if(pago===null)return;

  await actualizarIngreso(id,{
    precio:precio,
    metodo_pago:pago,
    estado:pago==='Pendiente'?'Pendiente':'Confirmada'
  });
}

async function regalarIngreso(id){
  if(!isAdmin())return alert('Solo el administrador');

  if(!confirm('¿Marcar esta pista como REGALADA? No contará como ingreso.'))return;

  await actualizarIngreso(id,{
    precio:0,
    metodo_pago:'Regalada',
    estado:'Regalada'
  });
}

async function borrarIngreso(id){
  if(!isAdmin())return alert('Solo el administrador');

  if(!confirm('¿Borrar definitivamente esta reserva? Esta acción no se puede deshacer.'))return;

  try{
    const r=await fetch(
      API+'?id=eq.'+encodeURIComponent(id),
      {
        method:'DELETE',
        headers:headers()
      }
    );

    if(!r.ok)throw Error(await r.text());

    await cargarNube();
    alert('Reserva borrada.');

  }catch(e){
    alert('No se pudo borrar la reserva.\n'+e.message);
  }
}

async function actualizarIngreso(id,cambios){
  try{
    const r=await fetch(
      API+'?id=eq.'+encodeURIComponent(id),
      {
        method:'PATCH',
        headers:headers({
          'Content-Type':'application/json',
          'Prefer':'return=representation'
        }),
        body:JSON.stringify(cambios)
      }
    );

    if(!r.ok)throw Error(await r.text());

    await cargarNube();
    alert('Reserva actualizada.');

  }catch(e){
    alert('No se pudo actualizar la reserva.\n'+e.message);
  }
}

function saveConfig(){
  if(!isAdmin()){
    alert('Solo el administrador puede modificar la configuración.');
    return;
  }

  const p=Number(document.getElementById('precioConfig').value);

  if(!Number.isFinite(p)||p<0){
    alert('Precio no válido.');
    return;
  }

  data.price=p;
  localStorage.setItem('padelPrice',String(p));

  alert('Configuración guardada.');
  render();
}

document.getElementById('mesIngreso').value=
  new Date().toISOString().slice(0,7);

render();
cargarNube();
</script>

</body>
</html>
