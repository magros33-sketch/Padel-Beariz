<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pádel Beariz</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f5f7;
  color:#17202a;
}
header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}
header h1{margin:0;font-size:28px}
header p{margin:6px 0 0;opacity:.8}

.container{
  max-width:650px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{margin-top:0}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:5px;
}

input,select,button{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:16px;
}

button{
  border:0;
  background:#16a34a;
  color:white;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}

button.secondary{background:#374151}
button.danger{background:#dc2626}

.reserva{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:13px;
  margin-top:10px;
}

.reserva strong{font-size:18px}

.estado{
  display:inline-block;
  padding:5px 8px;
  border-radius:8px;
  background:#fef3c7;
  margin-top:5px;
  font-size:13px;
}

.oculto{display:none}

.total{
  font-size:25px;
  font-weight:bold;
  text-align:center;
  margin:15px 0;
}

.small{
  font-size:13px;
  color:#6b7280;
}

.error{
  color:#dc2626;
  font-weight:bold;
  margin-top:10px;
}

.ok{
  color:#15803d;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <h1>🎾 Pádel Beariz</h1>
  <p>Reserva tu pista</p>
</header>

<div class="container">

  <div class="card">
    <h2>📅 Nueva reserva</h2>

    <label>Fecha</label>
    <input type="date" id="fecha">

    <label>Hora de inicio</label>
    <select id="hora">
      <option value="">Selecciona una hora</option>
      <option>09:00</option>
      <option>10:30</option>
      <option>12:00</option>
      <option>13:30</option>
      <option>15:00</option>
      <option>16:30</option>
      <option>18:00</option>
      <option>19:30</option>
      <option>21:00</option>
      <option>22:30</option>
    </select>

    <label>Nombre</label>
    <input type="text" id="nombre" placeholder="Tu nombre">

    <label>Teléfono</label>
    <input type="tel" id="telefono" placeholder="Teléfono">

    <label>Forma de pago</label>
    <select id="pay">
      <option value="Pendiente">Pendiente</option>
      <option value="Efectivo">Efectivo</option>
      <option value="Tarjeta">Tarjeta</option>
    </select>

    <button onclick="reservar()">Reservar pista</button>

    <div id="mensaje"></div>
  </div>


  <div class="card">
    <h2>📋 Reservas</h2>
    <div id="lista">Cargando...</div>
  </div>


  <div class="card">
    <h2>🔐 Administrador</h2>

    <div id="loginAdmin">
      <input type="password" id="pin" placeholder="PIN administrador">
      <button class="secondary" onclick="entrarAdmin()">Entrar</button>
    </div>

    <div id="panelAdmin" class="oculto">

      <h3>Reservas</h3>
      <div id="adminReservas">Cargando...</div>

      <hr style="margin:20px 0">

      <h3>💰 Ganancias</h3>
      <div class="total" id="ganancias">0 €</div>

      <button class="secondary" onclick="cargarTodo()">
        🔄 Actualizar
      </button>

      <button class="danger" onclick="salirAdmin()">
        Cerrar administrador
      </button>

    </div>
  </div>

</div>


<script>

const SUPABASE_URL =
"https://jppsqrbpjwulzapyvpim.supabase.co/rest/v1";

const SUPABASE_KEY =
"sb_publishable_M_k6UDXHwXZ7lvMSYQWp2w_iOEUIa23";

const PRECIO = 12;

const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};


function mostrarMensaje(texto,tipo="ok"){
  const m=document.getElementById("mensaje");
  m.className=tipo;
  m.innerText=texto;
}


function horaFin(hora){

  const partes=hora.split(":");
  let h=parseInt(partes[0]);
  let m=parseInt(partes[1]);

  m+=90;

  if(m>=60){
    h+=Math.floor(m/60);
    m=m%60;
  }

  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":00";
}


async function cargarReservas(){

  const lista=document.getElementById("lista");

  try{

    const r=await fetch(
      SUPABASE_URL+
      "/reservas?select=*&order=fecha.asc,hora_inicio.asc",
      {headers:HEADERS}
    );

    if(!r.ok){
      throw new Error(await r.text());
    }

    const datos=await r.json();

    if(datos.length===0){
      lista.innerHTML="<p>No hay reservas.</p>";
      return;
    }

    lista.innerHTML="";

    datos.forEach(x=>{

      const div=document.createElement("div");
      div.className="reserva";

      div.innerHTML=`
        <strong>${x.fecha}</strong><br>
        🎾 ${x.hora_inicio} - ${x.hora_fin}<br>
        👤 ${x.nombre}<br>
        <span class="estado">${x.estado || "Pendiente"}</span>
      `;

      lista.appendChild(div);
    });

  }catch(e){

    lista.innerHTML=
      '<div class="error">Error cargando reservas:<br>'+
      e.message+'</div>';

  }
}


async function reservar(){

  const fecha=document.getElementById("fecha").value;
  const hora=document.getElementById("hora").value;
  const nombre=document.getElementById("nombre").value.trim();
  const telefono=document.getElementById("telefono").value.trim();
  const metodo=document.getElementById("pay").value;

  if(!fecha || !hora || !nombre || !telefono){

    mostrarMensaje(
      "Completa fecha, hora, nombre y teléfono.",
      "error"
    );

    return;
  }


  try{

    mostrarMensaje("Comprobando disponibilidad...","ok");


    const consulta =
      SUPABASE_URL+
      "/reservas?fecha=eq."+encodeURIComponent(fecha)+
      "&hora_inicio=eq."+encodeURIComponent(hora)+
      "&select=id";


    const comprobacion=await fetch(
      consulta,
      {headers:HEADERS}
    );


    if(!comprobacion.ok){
      throw new Error(await comprobacion.text());
    }


    const existentes=await comprobacion.json();


    if(existentes.length>0){

      mostrarMensaje(
        "❌ Esa hora ya está reservada.",
        "error"
      );

      return;
    }


    const reserva={

      fecha:fecha,

      hora_inicio:hora,

      hora_fin:horaFin(hora),

      nombre:nombre,

      telefono:telefono,

      metodo_pago:metodo,

      estado:"Pendiente"

    };


    const respuesta=await fetch(
      SUPABASE_URL+"/reservas",
      {
        method:"POST",
        headers:{
          ...HEADERS,
          "Prefer":"return=representation"
        },
        body:JSON.stringify(reserva)
      }
    );


    if(!respuesta.ok){

      const error=await respuesta.text();

      throw new Error(error);
    }


    mostrarMensaje(
      "✅ Reserva realizada correctamente.",
      "ok"
    );


    document.getElementById("nombre").value="";
    document.getElementById("telefono").value="";
    document.getElementById("hora").value="";
    document.getElementById("pay").value="Pendiente";


    cargarReservas();


    if(!document
      .getElementById("panelAdmin")
      .classList.contains("oculto")){

      cargarAdmin();

    }

  }catch(e){

    mostrarMensaje(
      "Error al guardar: "+e.message,
      "error"
    );

  }
}


function entrarAdmin(){

  const pin=document.getElementById("pin").value;

  if(pin==="1234"){

    document
      .getElementById("loginAdmin")
      .classList.add("oculto");

    document
      .getElementById("panelAdmin")
      .classList.remove("oculto");

    cargarAdmin();

  }else{

    alert("PIN incorrecto");

  }
}


function salirAdmin(){

  document
    .getElementById("panelAdmin")
    .classList.add("oculto");

  document
    .getElementById("loginAdmin")
    .classList.remove("oculto");

  document.getElementById("pin").value="";
}


async function cargarAdmin(){

  const cont=document.getElementById("adminReservas");

  try{

    const r=await fetch(
      SUPABASE_URL+
      "/reservas?select=*&order=fecha.asc,hora_inicio.asc",
      {headers:HEADERS}
    );

    if(!r.ok){
      throw new Error(await r.text());
    }

    const datos=await r.json();

    if(datos.length===0){

      cont.innerHTML="<p>No hay reservas.</p>";

      document.getElementById("ganancias").innerText="0 €";

      return;
    }


    cont.innerHTML="";

    let total=0;


    datos.forEach(x=>{

      if(
        x.estado!=="Cancelada" &&
        (
          x.metodo_pago==="Efectivo" ||
          x.metodo_pago==="Tarjeta"
        )
      ){

        total+=PRECIO;

      }


      const div=document.createElement("div");

      div.className="reserva";


      div.innerHTML=`

        <strong>${x.fecha}</strong><br>

        🎾 ${x.hora_inicio} - ${x.hora_fin}<br>

        👤 ${x.nombre}<br>

        📞 ${x.telefono || ""}<br>

        💳 ${x.metodo_pago || "Pendiente"}<br>

        <span class="estado">
          ${x.estado || "Pendiente"}
        </span>

        <button
          class="secondary"
          onclick="confirmarReserva(${x.id})">
          Confirmar
        </button>

        <button
          class="danger"
          onclick="cancelarReserva(${x.id})">
          Cancelar
        </button>

      `;

      cont.appendChild(div);

    });


    document.getElementById("ganancias").innerText=
      total.toFixed(2)+" €";


  }catch(e){

    cont.innerHTML=
      '<div class="error">'+
      e.message+
      '</div>';

  }
}


async function confirmarReserva(id){

  try{

    const r=await fetch(
      SUPABASE_URL+"/reservas?id=eq."+id,
      {
        method:"PATCH",
        headers:{
          ...HEADERS,
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          estado:"Confirmada"
        })
      }
    );


    if(!r.ok){

      throw new Error(await r.text());

    }


    cargarTodo();

  }catch(e){

    alert("Error: "+e.message);

  }
}


async function cancelarReserva(id){

  if(!confirm("¿Cancelar esta reserva?")) return;


  try{

    const r=await fetch(
      SUPABASE_URL+"/reservas?id=eq."+id,
      {
        method:"PATCH",
        headers:{
          ...HEADERS,
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          estado:"Cancelada"
        })
      }
    );


    if(!r.ok){

      throw new Error(await r.text());

    }


    cargarTodo();

  }catch(e){

    alert("Error: "+e.message);

  }
}


function cargarTodo(){

  cargarReservas();

  if(
    !document
      .getElementById("panelAdmin")
      .classList.contains("oculto")
  ){

    cargarAdmin();

  }

}


document.getElementById("fecha").value=
  new Date().toISOString().split("T")[0];


cargarReservas();

</script>

</body>
</html>
