<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pádel Beariz</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#17221b
}

header{
  background:#123b2a;
  color:#fff;
  padding:18px
}

.wrap{
  max-width:980px;
  margin:auto;
  padding:16px
}

h1{margin:0 0 4px}
.sub{opacity:.85}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:12px
}

button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  background:#1e7a55;
  color:#fff;
  font-weight:700
}

button.active{background:#f2a900}
button.danger{background:#b3261e}

.card{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 10px #0001
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:10px
}

.slot{
  padding:14px;
  border-radius:12px;
  background:#e7f4ed;
  border:1px solid #b9ddca
}

.slot.busy{
  background:#ffe5e5;
  border-color:#f4b3b3
}

.small{
  font-size:13px;
  color:#68746d
}

.hidden{display:none}

.status{
  padding:10px;
  border-radius:10px;
  background:#fff3cd
}

.ok{background:#dff4e7}

.money{
  font-size:30px;
  font-weight:800
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #ccd5cf;
  border-radius:9px;
  margin:5px 0 10px
}

label{font-weight:700}

.row{
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap
}

table{
  width:100%;
  border-collapse:collapse
}

th,td{
  padding:9px;
  border-bottom:1px solid #eee;
  text-align:left
}

.reserva-item{
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:8px;
  background:#fafafa
}

.reserva-item.cancelada{
  opacity:.55
}

@media(max-width:600px){
  .wrap{padding:10px}
  .tabs button{flex:1 1 45%}
  table{font-size:13px}
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <h1>🎾 Pádel Beariz</h1>

  </div>

<main class="wrap">

🟡 Conectando con Supabase…

<div class="tabs">

<button class="active"

onclick="show('config',this)">

<button onclick="adminLogin()">
🔐 Admin
</button>

<button class="adminOnly"
onclick="logoutAdmin()">
Salir
</button>

</div>


<!-- RESERVAS -->

<section id="reservas" class="page">

<div class="card">

<div class="row">

<label>
Fecha
<input
id="viewDate"
type="date"
onchange="renderSlots()">
</label>

<button onclick="setToday()">
Hoy
</button>

</div>

</div>


<div class="card">

<h2>Horarios · Pista 1</h2>

<div class="small">
Cada reserva dura
<span id="durText">90</span>
minutos · Precio €
<span id="priceText">12</span>
</div>

<div id="slots" class="grid"></div>

</div>


<div class="card">

<h2>📋 Reservas del día</h2>

<div id="listaReservas">
No hay reservas para este día.
</div>

</div>

</section>


<!-- NUEVA RESERVA -->

<section id="nueva" class="page hidden">

<div class="card">

<h2>➕ Nueva reserva</h2>

<label>
Fecha
<input id="date" type="date">
</label>

<label>
Hora
<select id="time"></select>
</label>

<label>
Nombre
<input
id="player"
placeholder="Nombre del jugador">
</label>

<label>
Teléfono

id="phone"
inputmode="tel"
placeholder="Teléfono">

<label>
Pago

</select>

Reservar pista
</button>

<!-- INGRESOS -->

<section id="ingresos" class="page hidden adminOnly">

<label>
Mes
<input
id="monthPick"
type="month"
onchange="renderIncome()">
</label>

€0.00
</div>

0 reservas cobradas

</div>


<div class="card">

<div style="overflow:auto">

<table>

<tr>
<th>Fecha</th>

</tr>

</table>

</div>

</div>

</section>


<!-- CONFIGURACIÓN -->

<section id="config" class="page hidden adminOnly">

<div class="card">

<h2>⚙️ Configuración</h2>

<label>
Precio (€)
<input
id="price"
type="number"
step="0.50">
</label>

<label>
Duración (minutos)
<input
id="duration"

</label>

Inicio

id="start"

Fin

id="end"

Guardar configuración

</main>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
'https://jppsqrbpjwulzapyvpim.supabase.co';

const SUPABASE_KEY =
'sb_publishable_M_k6UDXHwXZ7lvMSYQWp2w_iOEUIa23';

const API =
SUPABASE_URL + '/rest/v1/reservas';


/* ================================
   DATOS
================================ */

let data = {
  reservas:[],
  price:12,
  duration:90,
  start:'09:00',
  end:'00:00'
};


/* ================================
   FECHA ACTUAL
================================ */

const today =
new Date().toISOString().slice(0,10);

viewDate.value = today;
date.value = today;

monthPick.value =
today.slice(0,7);


/* ================================
   ADMIN
================================ */

function isAdmin(){

  return sessionStorage.getItem(
    'padelAdmin'
  ) === '1';

}


function adminLogin(){

  let p =
  prompt(
    'PIN de administrador:'
  );

  if(p===null)return;

  let saved =
  localStorage.getItem(
    'padelPin'
  ) || '1234';

  if(p===saved){

    sessionStorage.setItem(
      'padelAdmin',
      '1'
    );

    applyRole();

    alert(
      'Administrador activado'
    );

  }else{

    alert(
      'PIN incorrecto'
    );

  }

}


function logoutAdmin(){

  sessionStorage.removeItem(
    'padelAdmin'
  );

  applyRole();

  show('reservas');

}


function applyRole(){

  document
  .querySelectorAll('.adminOnly')
  .forEach(e=>{

    e.style.display =
    isAdmin() ? '' : 'none';

  });

}


/* ================================
   CAMBIO DE PANTALLA
================================ */

function show(id,b){

  document
  .querySelectorAll('.page')
  .forEach(x=>
    x.classList.add('hidden')
  );

  document
  .getElementById(id)
  .classList.remove('hidden');

  if(b){

    document
    .querySelectorAll('.tabs button')
    .forEach(x=>
      x.classList.remove('active')
    );

    b.classList.add('active');

  }

  render();

}


/* ================================
   HORARIOS
================================ */

function times(){

  let out=[];

  let [h,m] =
  data.start
  .split(':')
  .map(Number);

  let [eh,em] =
  data.end
  .split(':')
  .map(Number);

  let end =
  eh*60 + em;

  if(end===0)
    end=1440;

  let cur =
  h*60 + m;

  while(
    cur + Number(data.duration)
    <= end
  ){

    out.push(
      String(
        Math.floor(cur/60)
      ).padStart(2,'0')
      + ':' +
      String(
        cur%60
      ).padStart(2,'0')
    );

    cur +=
    Number(data.duration);

  }

  return out;

}


function horaFin(t){

  let [h,m] =
  t.split(':')
  .map(Number);

  let x =
  h*60 +
  m +
  Number(data.duration);

  return String(
    Math.floor(x/60)%24
  ).padStart(2,'0')
  + ':' +
  String(x%60).padStart(2,'0');

}


/* ================================
   SEGURIDAD TEXTO
================================ */

function esc(v){

  return String(v ?? '')
  .replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );

}


/* ================================
   BUSCAR RESERVA
================================ */

function buscarReserva(d,t){

  return data.reservas.find(r=>

    String(r.fecha||'') === d &&

    String(r.hora_inicio||'')
    .slice(0,5) === t &&

    String(r.estado||'')
    .toLowerCase() !==
    'cancelada'

  );

}


/* ================================
   MOSTRAR HORARIOS
================================ */

function renderSlots(){

  let d =
  viewDate.value;

  slots.innerHTML =
  times()
  .map(t=>{

    let r =
    buscarReserva(d,t);

    if(r){

      return `
      <div class="slot busy">

        <b>${t}</b>

        <br>

        🔴 Ocupado

        <br>

        <span class="small">
        ${esc(r.nombre||r.usuario||'')}
        </span>

        ${
          isAdmin()
          ?
          `<br>
          <button
          class="danger"
          onclick="cancelar('${esc(r.id)}')">
          Cancelar
          </button>`
          :
          ''
        }

      </div>
      `;

    }


    return `
    <div class="slot">

      <b>${t}</b>

      <br>

      🟢 Disponible

      <br>

      <button
      onclick="reserveAt('${d}','${t}')">
      Reservar
      </button>

    </div>
    `;

  })
  .join('');


  durText.textContent =
  data.duration;

  priceText.textContent =
  Number(data.price)
  .toFixed(2);

  renderListaReservas();

}


/* ================================
   LISTA DEL DÍA
================================ */

function renderListaReservas(){

  let d =
  viewDate.value;

  let rs =
  data.reservas
  .filter(r=>
    String(r.fecha||'')===d
  )
  .filter(r=>
    String(r.estado||'')
    .toLowerCase()!=='cancelada'
  )
  .sort((a,b)=>
    String(a.hora_inicio)
    .localeCompare(
      String(b.hora_inicio)
    )
  );


  if(!rs.length){

    listaReservas.innerHTML =
    'No hay reservas para este día.';

    return;

  }


  listaReservas.innerHTML =
  rs.map(r=>`

    <div class="reserva-item">

      <b>
      🎾 Pista 1 ·
      ${esc(
        String(r.hora_inicio||'')
        .slice(0,5)
      )}
      </b>

      <br>

      👤 ${esc(
        r.nombre ||
        r.usuario ||
        ''
      )}

      <br>

      📞 ${esc(
        r.telefono || ''
      )}

      <br>

      💶 €${Number(
        r.precio ??
        data.price
      ).toFixed(2)}

      <br>

      💳 ${esc(
        r.metodo_pago || 'Pendiente'
      )}

      <br>

      <span class="small">
      Estado: ${esc(
        r.estado || 'Pendiente'
      )}
      </span>

    </div>

  `)
  .join('');

}


/* ================================
   RESERVAR DESDE HORARIO
================================ */

function reserveAt(d,t){

  date.value=d;

  render();

  time.value=t;

  show('nueva');

}


/* ================================
   CARGAR SUPABASE
================================ */

async function cargarNube(){

  try{

    let r =
    await fetch(
      API +
      '?select=*&order
