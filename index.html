<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pádel Beariz</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17221b}header{background:#123b2a;color:#fff;padding:18px}.wrap{max-width:980px;margin:auto;padding:16px}h1{margin:0 0 4px}.sub{opacity:.85}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}button{border:0;border-radius:10px;padding:11px 14px;background:#1e7a55;color:#fff;font-weight:700}button.active{background:#f2a900}.danger{background:#b3261e}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.slot{padding:14px;border-radius:12px;background:#e7f4ed;border:1px solid #b9ddca}.slot.busy{background:#ffe5e5;border-color:#f4b3b3}.small{font-size:13px;color:#68746d}.hidden{display:none}.status{padding:10px;border-radius:10px;background:#fff3cd}.ok{background:#dff4e7}.money{font-size:30px;font-weight:800}input,select{width:100%;padding:11px;border:1px solid #ccd5cf;border-radius:9px;margin:5px 0 10px}label{font-weight:700}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:600px){.wrap{padding:10px}.tabs button{flex:1 1 45%}table{font-size:13px}}
</style>
</head>
<body>

<header>
<div class="wrap">
<h1>🎾 Pádel Beariz</h1>
<div class="sub">Reservas · Ingresos</div>
</div>
</header>

<main class="wrap">

<div id="cloudStatus" class="status">🟡 Conectando…</div>

<div class="tabs">
<button class="active" onclick="show('reservas',this)">📅 Reservas</button>
<button onclick="show('nueva',this)">➕ Nueva</button>
<button class="adminOnly" onclick="show('ingresos',this)">💰 Ingresos</button>
<button class="adminOnly" onclick="show('config',this)">⚙️ Configuración</button>
<button onclick="adminLogin()">🔐 Admin</button>
<button onclick="show('reservas')">🏠 Inicio</button>
<button class="adminOnly" onclick="logoutAdmin()">Salir</button>
</div>

<section id="reservas" class="page">

<div class="card">
<div class="row">
<label>Fecha<input id="viewDate" type="date" onchange="renderSlots()"></label>
<button onclick="setToday()">Hoy</button>
</div>
</div>

<div class="card">
<h2>Horarios</h2>
<div class="small">
Cada reserva dura <span id="durText">90</span> minutos · Precio €<span id="priceText">12</span>
</div>
<div id="slots" class="grid"></div>
</div>

<div class="card">
<h2>📋 Reservas registradas</h2>
<div id="reservationList">No hay reservas para esta fecha.</div>
</div>

</section>

<section id="nueva" class="page hidden">

<div class="card">
<h2>➕ Nueva reserva</h2>

<label>Fecha<input id="date" type="date"></label>

<label>Hora<select id="time"></select></label>

<label>Nombre<input id="player" placeholder="Nombre del jugador"></label>

<label>Teléfono<input id="phone" inputmode="tel" placeholder="Teléfono"></label>

<label>Pago
<select id="pay">
<option>Pendiente</option>
<option>Efectivo</option>
<option>Tarjeta</option>
</select>
</label>

<button onclick="createReservation()">Reservar</button>
<button onclick="show('reservas')">🏠 Inicio</button>

</div>
</section>

<section id="ingresos" class="page hidden adminOnly">

<div class="card">
<label>Mes<input id="monthPick" type="month" onchange="renderIncome()"></label>
<div class="money" id="total">€0.00</div>
<div class="small" id="count">0 reservas cobradas</div>
</div>

<div class="card">
<div style="overflow:auto">
<table>
<thead>
<tr>
<th>Fecha</th>
<th>Hora</th>
<th>Jugador</th>
<th>Pago</th>
<th>Importe</th>
</tr>
</thead>
<tbody id="incomeRows"></tbody>
</table>
</div>
</div>

</section>

<section id="config" class="page hidden adminOnly">

<div class="card">
<h2>⚙️ Configuración</h2>

<label>Precio (€)
<input id="price" type="number" step="0.50">
</label>

<label>Duración (minutos)
<input id="duration" type="number" step="30">
</label>

<label>Inicio
<input id="start" type="time">
</label>

<label>Fin
<input id="end" type="time">
</label>

<button onclick="saveConfig()">Guardar configuración</button>

</div>
</section>

</main>

<script>

const SUPABASE_URL='https://jppsqrbpjwulzapyvpim.supabase.co';
const SUPABASE_KEY='sb_publishable_M_k6UDXHwXZ7lvMSYQWp2w_iOEUIa23';
const API=SUPABASE_URL+'/rest/v1/reservas';

let data={
reservas:[],
price:12,
duration:90,
start:'09:00',
end:'00:00'
};

const $=id=>document.getElementById(id);

function init(){

const today=new Date().toISOString().slice(0,10);

$('viewDate').value=today;
$('date').value=today;
$('monthPick').value=today.slice(0,7);

let cfg=JSON.parse(localStorage.getItem('padelConfig')||'null');

if(cfg){
data.price=Number(cfg.price)||12;
data.duration=Number(cfg.duration)||90;
data.start=cfg.start||'09:00';
data.end=cfg.end||'00:00';
}

render();
cargarNube();
setInterval(cargarNube,15000);

}

function isAdmin(){
return sessionStorage.getItem('padelAdmin')==='1'
}

function adminLogin(){

let p=prompt('PIN de administrador:');

if(p===null)return;

let saved=localStorage.getItem('padelPin')||'1234';

if(p===saved){

sessionStorage.setItem('padelAdmin','1');
applyRole();
alert('Administrador activado');

}else{

alert('PIN incorrecto');

}

}

function logoutAdmin(){

sessionStorage.removeItem('padelAdmin');
applyRole();
show('reservas');

}

function applyRole(){

$$('.adminOnly').forEach(e=>{
e.style.display=isAdmin()?'':'none'
});

}

function $$(sel){
return document.querySelectorAll(sel)
}

function show(id,b){

$$('.page').forEach(x=>x.classList.add('hidden'));

$(id).classList.remove('hidden');

if(b){

$$('.tabs button').forEach(x=>x.classList.remove('active'));

b.classList.add('active');

}

render();

}

function setToday(){

$('viewDate').value=new Date().toISOString().slice(0,10);

renderSlots();

}

function times(){

let inicio=data.start||'09:00';
let fin=data.end||'00:00';
let dur=Number(data.duration)||90;

let [h,m]=inicio.split(':').map(Number);
let [eh,em]=fin.split(':').map(Number);

if(!Number.isFinite(h)||!Number.isFinite(m)){
h=9;
m=0;
}

if(!Number.isFinite(eh)||!Number.isFinite(em)){
eh=0;
em=0;
}

let limite=eh*60+em;

if(limite===0)limite=1440;

let cur=h*60+m;
let out=[];

while(cur+dur<=limite){

out.push(
String(Math.floor(cur/60)%24).padStart(2,'0')+
':'+
String(cur%60).padStart(2,'0')
);

cur+=dur;

}

return out;

}

function horaFin(t){

let [h,m]=t.split(':').map(Number);
let x=h*60+m+90;

return String(Math.floor(x/60)%24).padStart(2,'0')+
':'+
String(x%60).padStart(2,'0');

}

function esc(v){

return String(v??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[m])
);

}

function renderSlots(){

let d=$('viewDate').value;
let horas=times();

$('slots').innerHTML=horas.map(t=>{

let r=data.reservas.find(x=>
String(x.fecha||'')===d &&
String(x.hora_inicio||'').slice(0,5)===t &&
String(x.estado||'')!=='Cancelada'
);

return r

? `<div class="slot busy">
<b>${t}</b><br>
🔴 Ocupado<br>
<span class="small">${esc(r.nombre||'')}</span><br>
<button onclick="solicitarCancelacion('${esc(r.id)}','${esc(r.telefono||'')}')">
Solicitar cancelación
</button>
${isAdmin()?`
<br>
<button class="danger" onclick="cancelar('${esc(r.id)}')">
Cancelar
</button>`:''}
</div>`

: `<div class="slot">
<b>${t}</b><br>
🟢 Disponible<br>
<button onclick="reserveAt('${d}','${t}')">
Reservar
</button>
</div>`;

}).join('');

let rs=data.reservas.filter(x=>
String(x.fecha||'')===d &&
String(x.estado||'')!=='Cancelada'
);

$('reservationList').innerHTML=rs.length?

rs.map(r=>`

<div class="card" style="margin:8px 0;padding:12px">

<b>
🕐 ${esc(String(r.hora_inicio||'').slice(0,5))}–
${esc(String(r.hora_fin||'').slice(0,5))}
</b>

· ${esc(r.nombre||'')}<br>

<span class="small">
📞 ${esc(r.telefono||'')} ·
💳 ${esc(r.metodo_pago||'Pendiente')} ·
${esc(r.estado||'')}
</span>

<br>

<button onclick="solicitarCancelacion('${esc(r.id)}','${esc(r.telefono||'')}')">
Solicitar cancelación
</button>

${isAdmin()?`
<br>
<button class="danger" onclick="cancelar('${esc(r.id)}')">
Cancelar
</button>`:''}

</div>

`).join('')

:'No hay reservas para esta fecha.';

$('durText').textContent=data.duration;
$('priceText').textContent=Number(data.price).toFixed(2);

}

function reserveAt(d,t){

$('date').value=d;

render();

$('time').value=t;

show('nueva');

}

async function cargarNube(){

try{

let r=await fetch(
API+'?select=*&order=fecha.asc,hora_inicio.asc',
{
headers:{
apikey:SUPABASE_KEY,
Authorization:'Bearer '+SUPABASE_KEY
}
}
);

if(!r.ok)throw Error(await r.text());

data.reservas=await r.json();

localStorage.setItem(
'padelReservas',
JSON.stringify(data.reservas)
);

$('cloudStatus').textContent='🟢 Conectado a Supabase';
$('cloudStatus').className='status ok';

}catch(e){

data.reservas=JSON.parse(
localStorage.getItem('padelReservas')||'[]'
);

$('cloudStatus').textContent=
'🟡 Supabase no responde; usando datos de este móvil';

$('cloudStatus').className='status';

}

render();

}

async function createReservation(){

let d=$('date').value;
let t=$('time').value;
let n=$('player').value.trim();

if(!d||!t||!n)
return alert('Completa fecha, hora y nombre');

if(
data.reservas.some(r=>
String(r.fecha)===d &&
String(r.hora_inicio||'').slice(0,5)===t &&
String(r.estado||'')!=='Cancelada'
)
)
return alert('Ese horario ya está ocupado');

let r={
fecha:d,
hora_inicio:t,
hora_fin:horaFin(t),
nombre:n,
telefono:$('phone').value.trim(),
metodo_pago:$('pay').value,
estado:'Pendiente'
};

try{

let resp=await fetch(
API,
{
method:'POST',
headers:{
apikey:SUPABASE_KEY,
Authorization:'Bearer '+SUPABASE_KEY,
'Content-Type':'application/json',
Prefer:'return=representation'
},
body:JSON.stringify(r)
}
);

if(!resp.ok)
throw Error(await resp.text());

alert('Reserva registrada');

$('player').value='';
$('phone').value='';

await cargarNube();

$('date').value=d;

show('reservas');

}catch(e){

alert('No se pudo guardar la reserva.\n\n'+e.message);

}

}

async function solicitarCancelacion(id,telefono){

let p=prompt(
'Introduce el teléfono usado en la reserva:'
);

if(p===null)return;

const normalizar=s=>
String(s||'').replace(/\D/g,'');

if(normalizar(p)!==normalizar(telefono))
return alert('El teléfono no coincide con la reserva.');

if(!confirm(
'¿Solicitar la cancelación de esta reserva?'
))return;

try{

let r=await fetch(
API+'?id=eq.'+encodeURIComponent(id),
{
method:'PATCH',
headers:{
apikey:SUPABASE_KEY,
Authorization:'Bearer '+SUPABASE_KEY,
'Content-Type':'application/json'
},
body:JSON.stringify({
estado:'Solicitud de cancelación'
})
}
);

if(!r.ok)
throw Error(await r.text());

alert('Solicitud enviada al administrador.');

await cargarNube();

}catch(e){

alert(
'No se pudo enviar la solicitud.\n'+e.message
);

}

}

async function cancelar(id){

if(!isAdmin())
return alert('Solo el administrador');

if(!confirm('¿Cancelar esta reserva?'))
return;

try{

let r=await fetch(
API+'?id=eq.'+encodeURIComponent(id),
{
method:'PATCH',
headers:{
apikey:SUPABASE_KEY,
Authorization:'Bearer '+SUPABASE_KEY,
'Content-Type':'application/json'
},
body:JSON.stringify({
estado:'Cancelada'
})
}
);

if(!r.ok)
throw Error(await r.text());

await cargarNube();

}catch(e){

alert(
'No se pudo cancelar.\n'+e.message
);

}

}

function renderIncome(){

if(!isAdmin())return;

let m=$('monthPick').value;

let rs=data.reservas.filter(r=>
String(r.fecha||'').startsWith(m) &&
r.metodo_pago &&
r.metodo_pago!=='Pendiente' &&
String(r.estado||'')!=='Cancelada'
);

let total=rs.length*Number(data.price);

$('total').textContent='€'+total.toFixed(2);

$('count').textContent=
rs.length+' reservas cobradas';

$('incomeRows').innerHTML=
rs.map(r=>
`<tr>
<td>${esc(r.fecha)}</td>
<td>${esc(String(r.hora_inicio||'').slice(0,5))}</td>
<td>${esc(r.nombre)}</td>
<td>${esc(r.metodo_pago)}</td>
<td>€${Number(data.price).toFixed(2)}</td>
</tr>`
).join('');

}

function saveConfig(){

if(!isAdmin())
return alert('Solo el administrador');

data.price=Number($('price').value)||12;
data.duration=Number($('duration').value)||90;
data.start=$('start').value||'09:00';
data.end=$('end').value||'00:00';

localStorage.setItem(
'padelConfig',
JSON.stringify(data)
);

render();

alert('Configuración guardada en este móvil');

}

function render(){

if(!data.start)data.start='09:00';

if(!data.end)data.end='00:00';

if(!Number(data.duration)||Number(data.duration)<30)
data.duration=90;

$('price').value=data.price;
$('duration').value=data.duration;
$('start').value=data.start;
$('end').value=data.end;

const selector=$('time');

const horas=times();

selector.innerHTML=
horas.map(t=>
`<option value="${t}">${t}</option>`
).join('');

renderSlots();
renderIncome();
applyRole();

}

init();

</script>

</body>
</html>
